<head><script>(function(){var OK="somo-transportation.github.io",H=location.hostname;if(H===OK||H==="localhost"||H==="127.0.0.1")return;var U="https://"+OK+"/somo-accounts/";document.addEventListener("DOMContentLoaded",function(){document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff9d6;font-family:Tahoma,Arial,sans-serif;text-align:center;padding:16px;direction:rtl"><div style="max-width:420px;background:#fffef5;border:1px solid #e8dfa6;border-radius:14px;padding:24px;color:#0b6e99"><h2 style="margin-top:0">محاسبة برج السمو للنقليات</h2><p>هذا ليس الرابط الرسمي للنظام.<br>سيتم تحويلك تلقائياً إلى الرابط الصحيح، ويرجى حفظه.</p><p dir="ltr" style="font-weight:700">somo-transportation.github.io/somo-accounts</p><a href="'+U+'" style="display:inline-block;margin-top:14px;background:#0e7490;color:#fff;text-decoration:none;padding:10px 22px;border-radius:8px">فتح الرابط الصحيح</a></div></div>';setTimeout(function(){location.replace(U)},2500)})})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#fff9d6;--card:#fffef5;--ink:#0b6e99;--mute:#3f8fb0;--pri:#0e7490;--pri2:#0a5a73;--line:#e8dfa6;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{background:var(--pri2);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:1.2rem;flex:1;min-width:180px}header small{display:block;font-weight:400;opacity:.85;font-size:.8rem}
header a{color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1200px;margin:0 auto;padding:16px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 2px}
.btn{border:0;background:var(--pri);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.del{background:var(--bad)}.btn.sm{padding:3px 10px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.bar>div{min-width:120px}.bar .grow{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:1.35rem;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.kpi span{font-size:.85rem;color:var(--mute)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem}th{background:var(--pri);color:#fff;text-align:right;padding:9px 10px;white-space:nowrap}td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.grp td{background:#fff6c2;font-weight:600}tfoot td{font-weight:700;background:#fff6c2}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.78rem;color:#fff;background:var(--mute)}.t-ok{background:var(--ok)}.t-warn{background:var(--warn)}.t-bad{background:var(--bad)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:6px;vertical-align:middle}.dot.g1{background:#22a043}.dot.r1{background:#d33}.dot.x{background:#aaa}
.tg{cursor:pointer;display:inline-block;width:18px;text-align:center;user-select:none}
.mute{color:var(--mute)}.er{color:var(--bad);min-height:1.2em;font-size:.9rem}
.dfw{display:inline-flex;gap:4px;align-items:center;direction:ltr}.dfw input{width:128px;text-align:center}.dfw button{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:6px 8px}
dialog{border:0;border-radius:14px;padding:0;width:min(980px,96vw);background:var(--card);color:var(--ink);max-height:94vh}dialog::backdrop{background:#0006}
.dh{background:var(--pri2);color:#fff;padding:14px 18px;font-weight:700}.db{padding:14px 18px;overflow:auto;max-height:calc(94vh - 150px)}.da{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.box{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.ban{background:var(--warn);color:#fff;padding:8px 14px;text-align:center}.ban button{margin-inline-start:10px}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
@media(max-width:640px){main{padding:10px}.dfw input{width:112px}}
</style>

<body>
<div id="ban"></div><div id="app"></div>
<dialog id="dlg"><div class="dh" id="dh"></div><div class="db" id="db"></div><div class="da" id="da"></div></dialog>
<datalist id="accl"></datalist>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,addDoc,serverTimestamp,runTransaction,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const CFG={apiKey:"AIzaSyDix-1jo4u4_nwBGLGIwtvW1L7FcjxizX4",authDomain:"somo-transport.firebaseapp.com",projectId:"somo-transport",storageBucket:"somo-transport.firebasestorage.app",messagingSenderId:"987984151527",appId:"1:987984151527:web:7d1030349784ed9072b342"};
const app=initializeApp(CFG),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=id=>document.getElementById(id),A=$("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>{const v=parseFloat(String(x??"").replace(/,/g,""));return isNaN(v)?0:v};
const C=x=>Math.round(num(x)*100),n2=c=>(c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=(n,w)=>String(n).padStart(w,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)};
const okD=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;const d=new Date(s+"T00:00:00Z");return!isNaN(d)&&d.toISOString().slice(0,10)===s};
const hij=s=>{try{if(!okD(s))return"";const o={};new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date(s+"T12:00:00")).forEach(x=>o[x.type]=x.value);const r=(o.year||o.relatedYear)+"-"+pad(o.month,2)+"-"+pad(o.day,2);return/^\d{4}-\d{2}-\d{2}$/.test(r)?r:""}catch(e){return""}};
const TYPES={a:"أصول",l:"خصوم",e:"حقوق ملكية",r:"إيرادات",x:"مصروفات"},SIDE={a:"d",x:"d",l:"c",e:"c",r:"c"};
let ME=null,tab="home",S={acc:[],ent:[],cust:[],supp:[],cars:[],am:new Map()},unsubs=[],EXP=new Set(),loaded=0;
const F={ent:{from:"",to:"",st:"",q:""},led:{acc:"",from:"",to:"",cc:""},tb:{from:"",to:today(),lvl:"leaf",hz:true},car:{from:today().slice(0,4)+"-01-01",to:today()},coa:{q:""}};
const log=(a,c,k)=>addDoc(collection(db,"audit"),{uid:ME.uid,name:ME.name||ME.email,action:a,coll:c,key:String(k),ts:serverTimestamp()}).catch(()=>{});
const ERR={"auth/invalid-credential":"البريد أو كلمة السر غير صحيحة","auth/invalid-email":"البريد غير صحيح","auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً","permission-denied":"لا تملك صلاحية تنفيذ هذه العملية"};
const err=e=>ERR[e.code]||e.message||String(e);
const sortC=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});

/* ---------- تسجيل الدخول والصلاحية ---------- */
function loginView(m){A.innerHTML=`<div class="box"><h2 style="margin:0;text-align:center">محاسبة برج السمو</h2><p class="mute" style="text-align:center">تسجيل الدخول (نفس حساب نظام السمو)</p><form id="lf"><label>البريد الإلكتروني</label><input type="email" id="em" autocomplete="username" required><label>كلمة السر</label><input type="password" id="pw" autocomplete="current-password" required><div class="er" id="er">${esc(m||"")}</div><button class="btn" style="width:100%">دخول</button></form></div>`;
 $("lf").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(x){$("er").textContent=err(x)}}}
function stop(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[]}
onAuthStateChanged(auth,async u=>{stop();ME=null;if(!u)return loginView();
 try{const s=await getDoc(doc(db,"users",u.uid));const d=s.exists()?s.data():null;
  if(!d||d.active!==true){A.innerHTML=`<div class="box"><p>حسابك غير مفعّل. تواصل مع المدير.</p><button class="btn" onclick="logout()">خروج</button></div>`;return}
  ME={uid:u.uid,email:u.email,name:d.name,role:d.role,acct:d.role==="admin"||d.acct===true};
  if(!ME.acct){A.innerHTML=`<div class="box"><h3 style="margin-top:0">لا تملك صلاحية المحاسبة</h3><p>اطلب من المدير تفعيل صلاحية «المحاسبة» لحسابك من صفحة إدارة النظام.</p><a class="btn" href="../somo/" style="text-decoration:none;display:inline-block">العودة لنظام السمو</a> <button class="btn sec" onclick="logout()">خروج</button></div>`;return}
  start()}catch(x){A.innerHTML=`<div class="box"><p class="er">${esc(err(x))}</p><button class="btn" onclick="logout()">خروج</button></div>`}});
window.logout=()=>signOut(auth);
function sub(name,key,fn){unsubs.push(onSnapshot(collection(db,name),s=>{S[key]=s.docs.map(d=>({...d.data(),_id:d.id}));if(fn)fn();loaded++;sched()},e=>{console.warn(name,e.code)}))}
let rq=0;function sched(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(ME)view()})}
function start(){loaded=0;
 sub("acc_accounts","acc",()=>{S.acc.sort(sortC);S.am=new Map(S.acc.map(a=>[a.code,a]));draw()});
 sub("acc_entries","ent",()=>{S.ent.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.no||1e12)-(b.no||1e12))});
 sub("customers","cust");sub("suppliers","supp");sub("cars","cars");shell();chkVer();setInterval(chkVer,300000)}
function draw(){const dl=$("accl");if(dl)dl.innerHTML=ordered().filter(a=>!a.grp&&a.active!==false).map(a=>`<option value="${esc(a.code+" — "+a.name)}"></option>`).join("")}
const TABS=[["home","الرئيسية"],["coa","دليل الحسابات"],["ent","قيود اليومية"],["led","دفتر الأستاذ"],["tb","ميزان المراجعة"],["car","ربحية السيارات"]];
function shell(){A.innerHTML=`<header><h1>محاسبة برج السمو للنقليات<small>${esc(ME.name||ME.email)} · نسخة <span id="vv"></span></small></h1><a class="btn sec" style="color:#fff;border-color:#fff8;text-decoration:none" href="../somo/">← نظام السمو</a><button class="btn sec" style="color:#fff;border-color:#fff8" onclick="logout()">خروج</button></header><nav id="nv">${TABS.map(([k,n])=>`<button data-t="${k}" onclick="go('${k}')">${n}</button>`).join("")}</nav><main id="main"></main>`;
 const m=document.querySelector('meta[name="app-version"]');$("vv").textContent=m?m.content:"";view()}
window.go=t=>{tab=t;view()};
function view(){if(!$("main"))return;document.querySelectorAll("#nv button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));({home,coa,ent,led,tb,car})[tab]()}

/* ---------- أدوات ---------- */
const depth=c=>{let d=0,x=S.am.get(c);while(x&&x.parent&&d<20){d++;x=S.am.get(x.parent)}return d};
const kids=c=>S.acc.filter(a=>(a.parent||"")===c);
const ordered=()=>{const o=[],seen=new Set();const add=p=>kids(p).forEach(a=>{if(seen.has(a.code))return;seen.add(a.code);o.push(a);add(a.code)});add("");S.acc.forEach(a=>{if(!seen.has(a.code))o.push(a)});return o};
const hasEnt=c=>{const set=new Set([c]);const st=[c];while(st.length){const x=st.pop();kids(x).forEach(k=>{set.add(k.code);st.push(k.code)})}return S.ent.some(e=>(e.lines||[]).some(l=>set.has(l.acc)))};
function agg(f){const m=new Map();for(const e of S.ent){if(e.status!=="posted")continue;if(f.from&&e.date<f.from)continue;if(f.to&&e.date>f.to)continue;if(f.before&&e.date>=f.before)continue;for(const l of e.lines||[]){if(f.cc&&(l.cc||"")!==f.cc)continue;const a=m.get(l.acc)||[0,0];a[0]+=C(l.dr);a[1]+=C(l.cr);m.set(l.acc,a)}}return m}
function roll(m){const t=new Map();for(const[c,[d,k]]of m){let x=c,g=0;while(x&&g++<20){const a=t.get(x)||[0,0];a[0]+=d;a[1]+=k;t.set(x,a);const ac=S.am.get(x);x=ac?ac.parent:""}}return t}
const net=(a,code)=>{const x=a?a:[0,0];const s=(S.am.get(code)||{}).side||"d";return s==="d"?x[0]-x[1]:x[1]-x[0]};
const dc=n=>n>=0?[n,0]:[0,-n];
const dcell=n=>n?n2(n):"";
function dateInp(id,v,on){return`<span class="dfw"><input id="${id}" dir="ltr" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd" autocomplete="off" value="${esc(v||"")}" data-on="${on||""}" oninput="dm(this)"><button type="button" onclick="pickD('${id}')" title="التقويم">📅</button></span>`}
window.dm=el=>{const v=el.value.replace(/\D/g,"").slice(0,8);el.value=v.slice(0,4)+(v.length>4?"-"+v.slice(4,6):"")+(v.length>6?"-"+v.slice(6,8):"");if(el.dataset.on&&(el.value===""||okD(el.value)))window[el.dataset.on](el)};
window.pickD=id=>{const el=$(id),t=document.createElement("input");t.type="date";t.style.cssText="position:fixed;opacity:0;pointer-events:none";if(okD(el.value))t.value=el.value;document.body.appendChild(t);t.onchange=()=>{el.value=t.value;el.dispatchEvent(new Event("input"));t.remove()};t.onblur=()=>setTimeout(()=>t.remove(),300);try{t.showPicker()}catch(e){t.click()}};
function openDlg(title,body,btns){$("dh").textContent=title;$("db").innerHTML=body;$("da").innerHTML=btns;if(!$("dlg").open)$("dlg").showModal()}
window.closeDlg=()=>{$("dlg").close()};
function prt(title,html){const w=window.open("","_blank");if(!w){alert("اسمح بالنوافذ المنبثقة للطباعة");return}w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:18px;color:#111}h2,h3{margin:4px 0}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}th,td{border:1px solid #888;padding:4px 6px;text-align:right}th{background:#eee}td.n,th.n{text-align:left;direction:ltr}tfoot td{font-weight:700;background:#f4f4f4}.m{color:#555;font-size:12px}@media print{button{display:none}}</style></head><body><h2>برج السمو للنقليات</h2><h3>${esc(title)}</h3>${html}<p class="m">طُبع بتاريخ ${today()}</p><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}
function csv(name,rows){const t="﻿"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const rangeTxt=(f,t)=>(f||t)?`الفترة: ${f||"البداية"} إلى ${t||"اليوم"}`:"كل الفترات";
const ccName=c=>c?c:"—";
const emptyNote=()=>S.acc.length?"":`<div class="card" style="margin-bottom:12px">لا يوجد دليل حسابات بعد. اذهب إلى «دليل الحسابات» وأنشئ الدليل الافتراضي المناسب للنقليات.</div>`;

/* ---------- الرئيسية ---------- */
function home(){const y=today().slice(0,4),m=agg({from:y+"-01-01",to:y+"-12-31"});let rev=0,exp=0;for(const[c,x]of m){const a=S.am.get(c);if(!a)continue;if(a.type==="r")rev+=x[1]-x[0];if(a.type==="x")exp+=x[0]-x[1]}
 const all=agg({});let d=0,k=0;for(const[,x]of all){d+=x[0];k+=x[1]}const posted=S.ent.filter(e=>e.status==="posted"),dr=S.ent.filter(e=>e.status==="draft");
 const rec=[...posted].sort((a,b)=>(b.no||0)-(a.no||0)).slice(0,8);
 $("main").innerHTML=emptyNote()+`<div class="g"><div class="kpi"><b>${S.acc.length}</b><span>عدد الحسابات</span></div><div class="kpi"><b>${posted.length}</b><span>قيود مرحّلة</span></div><div class="kpi"><b>${dr.length}</b><span>مسودات تنتظر الترحيل</span></div><div class="kpi"><b class="${d===k?"ok-t":"bad-t"}">${d===k?"متوازن ✔":"غير متوازن"}</b><span>مجموع المدين = الدائن</span></div></div>
 <h3>أداء سنة ${y} (من القيود المرحّلة)</h3><div class="g"><div class="kpi"><b>${n2(rev)}</b><span>الإيرادات</span></div><div class="kpi"><b>${n2(exp)}</b><span>المصروفات</span></div><div class="kpi"><b class="${rev-exp>=0?"ok-t":"bad-t"}">${n2(rev-exp)}</b><span>صافي الربح (الخسارة)</span></div></div>
 <h3>آخر القيود</h3><div class="wrap"><table><tr><th>الرقم</th><th>التاريخ</th><th>البيان</th><th class="n">المبلغ</th></tr>${rec.map(e=>`<tr style="cursor:pointer" onclick="entOpen('${e._id}')"><td>${e.no}</td><td dir="ltr">${esc(e.date)}</td><td>${esc(e.desc)}</td><td class="n">${n2(C(e.totalDr))}</td></tr>`).join("")||'<tr><td colspan="4" class="mute">لا توجد قيود مرحّلة بعد</td></tr>'}</table></div>
 <p class="mute">هذه نسخة للتقييم: الأرقام من قيود تدخلها هنا. الترحيل التلقائي من فواتير وسندات السمو في المرحلة التالية.</p>`}

/* ---------- دليل الحسابات ---------- */
const SEED=[
["1","الأصول","a",1],["11","الأصول المتداولة","a",1],["111","النقد والبنوك","a",1],["1111","الصندوق","a",0],["1112","البنوك","a",1],["11121","بنك الراجحي","a",0],["11122","البنك الأهلي","a",0],
["112","العملاء","a",1],["1121","عملاء النقل","a",1,{sub:1}],
["113","العهد والسلف","a",1],["1131","عهد السائقين","a",0],["1132","سلف الموظفين","a",0],
["114","مصروفات مدفوعة مقدماً","a",1],["1141","تأمين سيارات مدفوع مقدماً","a",0],["1142","رسوم وتراخيص مدفوعة مقدماً","a",0],

function visibleTree(){const q=F.coa.q.trim();const out=[];const add=(p,lv)=>{for(const a of kids(p)){const hit=!q||(a.code+" "+a.name).includes(q);out.push({a,lv,hit});if(a.grp&&(q||EXP.has(a.code)))add(a.code,lv+1)}};add("",0);
 if(!q)return out;const keep=new Set();const m=new Map(out.map(o=>[o.a.code,o]));for(const o of out)if(o.hit){let x=o.a;while(x){keep.add(x.code);x=S.am.get(x.parent)}}return out.filter(o=>keep.has(o.a.code))}
function coaRows(){const tot=roll(agg({}));return visibleTree().map(({a,lv})=>{const b=net(tot.get(a.code),a.code);const act=a.active===false;
 return`<tr class="${a.grp?"grp":""}" style="${act?"opacity:.55":""}"><td style="padding-right:${10+lv*22}px">${a.grp?`<span class="tg" onclick="tgl('${a.code}')">${EXP.has(a.code)||F.coa.q?"▾":"▸"}</span>`:'<span class="tg"></span>'}<span class="dot ${act?"x":a.grp?"g1":"r1"}"></span><span dir="ltr" style="unicode-bidi:isolate">${esc(a.code)}</span> &nbsp;${esc(a.name)}${act?' <span class="tag">معطّل</span>':""}${a.link?' <span class="tag" title="مرتبط ببيانات السمو">مرتبط</span>':""}</td><td>${TYPES[a.type]||""}</td><td>${a.side==="d"?"مدين":"دائن"}</td><td class="n">${b?n2(b)+(b<0?" (عكس)":""):""}</td><td style="white-space:nowrap">${a.grp?`<button class="btn sm sec" onclick="accNew('${a.code}')">+ فرعي</button> `:`<button class="btn sm sec" onclick="accNew('${a.code}')" title="سيتحول إلى حساب رئيسي إن لم تكن عليه حركة">+ فرعي</button> `}<button class="btn sm sec" onclick="accEdit('${a.code}')">تعديل</button></td></tr>`}).join("")||`<tr><td colspan="5" class="mute">لا توجد نتائج</td></tr>`}

 try{const b=writeBatch(db);for(const[code,name,type,grp,o]of SEED){let p="";for(let i=code.length-1;i>0;i--){if(SEED.some(s=>s[0]===code.slice(0,i))){p=code.slice(0,i);break}}
  b.set(doc(db,"acc_accounts",code),{code,name,parent:p,type,grp:!!grp,side:(o&&o.side)||SIDE[type],active:true,sub:!!(o&&o.sub),createdAt:serverTimestamp(),createdBy:ME.uid})}
  await b.commit();log("إنشاء الدليل الافتراضي","acc_accounts","seed");EXP=new Set(["1","2","3","4","5"])}catch(x){alert(err(x))}};
function nextCode(pc){const p=S.am.get(pc);const w=p&&p.sub?3:1;const ks=kids(pc).map(k=>parseInt(String(k.code).slice(pc.length),10)||0);let n=(ks.length?Math.max(...ks):0)+1;let c;do{c=pc+(w>1?pad(n,w):String(n));n++}while(S.am.has(c));return c}

 if(!/^\d+$/.test(code)){e.textContent="رقم الحساب أرقام فقط";return}if(!name){e.textContent="اسم الحساب مطلوب";return}
 if(isNew){if(S.am.has(code)){e.textContent="الرقم مستخدم لحساب آخر";return}if(parent&&!code.startsWith(parent)){e.textContent="رقم الحساب يجب أن يبدأ برقم الحساب الأب ("+parent+")";return}}
 try{if(isNew){const b=writeBatch(db);const p=parent?S.am.get(parent):null;if(p&&!p.grp)b.update(doc(db,"acc_accounts",parent),{grp:true});
   b.set(doc(db,"acc_accounts",code),{code,name,parent,type,grp,side,active:true,sub:false,createdAt:serverTimestamp(),createdBy:ME.uid});await b.commit();if(parent)EXP.add(parent);log("إضافة حساب","acc_accounts",code)}
  else{await updateDoc(doc(db,"acc_accounts",code),{name,grp,side,type,updatedAt:serverTimestamp()});log("تعديل حساب","acc_accounts",code)}

window.syncSub=async()=>{const jobs=[["customers",S.cust,"1121","CustNo","CustName","asset"],["suppliers",S.supp,"2111","SuppNo","SuppName","liab"]];
 const miss=jobs.filter(j=>!S.am.get(j[2]));if(miss.length){alert("أنشئ الدليل الافتراضي أولاً (الحسابان 1121 و2111 غير موجودين)");return}
 try{const b=writeBatch(db);let add=0,upd=0;for(const[k,list,pc,nk,nm]of jobs){const p=S.am.get(pc);const used=new Set(S.acc.map(a=>a.code));const link=new Map(S.acc.filter(a=>a.link&&a.link.k===k).map(a=>[String(a.link.no),a]));
   for(const r of [...list].sort((x,y)=>num(x[nk])-num(y[nk]))){const no=String(r[nk]??"").trim();if(!no)continue;const nmv=String(r[nm]||"").trim()||("رقم "+no);const ex=link.get(no);
    if(ex){if(ex.name!==nmv){b.update(doc(db,"acc_accounts",ex.code),{name:nmv});upd++}continue}
    let n=/^\d+$/.test(no)&&parseInt(no,10)<1000?parseInt(no,10):0;let code=n?pc+pad(n,3):"";if(!code||used.has(code)){n=1;do{code=pc+pad(n,3);n++}while(used.has(code))}used.add(code);
    b.set(doc(db,"acc_accounts",code),{code,name:nmv,parent:pc,type:p.type,grp:false,side:p.side,active:true,sub:false,link:{k,no},createdAt:serverTimestamp(),createdBy:ME.uid});add++}}
  if(!add&&!upd){alert("كل العملاء والموردين لديهم حسابات ومحدّثة");return}await b.commit();EXP.add("1121");EXP.add("2111");EXP.add("112");EXP.add("211");log("مزامنة العملاء والموردين","acc_accounts",add+"/"+upd);alert("أُضيف "+add+" حساباً وحُدّث "+upd)}catch(x){alert(err(x))}};

 return l.map(e=>{const[t,c]=stOf(e);return`<tr style="cursor:pointer" onclick="entOpen('${e._id}')"><td>${e.no||"—"}</td><td dir="ltr">${esc(e.date)}</td><td>${esc(e.desc)}${e.type==="opening"?' <span class="tag">افتتاحي</span>':""}</td><td>${esc(e.ref||"")}</td><td class="n">${n2(C(e.totalDr))}</td><td><span class="tag ${c}">${t}</span></td></tr>`}).join("")||'<tr><td colspan="6" class="mute">لا توجد قيود</td></tr>'}

function totUpd(){const[d,k]=sums(),df=d-k;$("etot").innerHTML=`<b>المدين:</b> <span dir="ltr">${n2(d)}</span> &nbsp; <b>الدائن:</b> <span dir="ltr">${n2(k)}</span> &nbsp; <b>الفرق:</b> <span class="${df===0&&d>0?"ok-t":"bad-t"}" dir="ltr">${n2(df)}</span> ${df===0&&d>0?"✔ القيد متوازن":""}`}
window.entDel=async()=>{if(!ED.id||!confirm("حذف هذه المسودة؟"))return;try{await deleteDoc(doc(db,"acc_entries",ED.id));log("حذف مسودة قيد","acc_entries",ED.id);closeDlg()}catch(x){alert(err(x))}};
window.entSave=async post=>{const r=ED.rec,e=$("eer");e.textContent="";if(!okD(r.date)){e.textContent="التاريخ غير صحيح (سنة-شهر-يوم)";return}
 const lines=[];for(const l of r.lines){if(!l.acc&&!num(l.dr)&&!num(l.cr))continue;const a=resAcc(l.acc);
  if(post||l.acc){if(!a){e.textContent="حساب غير موجود: "+(l.acc||"(سطر بلا حساب)");return}if(a.grp){e.textContent="الحساب «"+a.name+"» رئيسي تجميعي، اختر حسابه الفرعي";return}if(a.active===false){e.textContent="الحساب «"+a.name+"» معطّل";return}}
  if(C(l.dr)>0&&C(l.cr)>0){e.textContent="السطر لا يحمل مدين ودائن معاً";return}
  lines.push({acc:a?a.code:"",dr:C(l.dr)/100,cr:C(l.cr)/100,cc:l.cc||"",note:l.note||""})}
 let d=0,k=0;lines.forEach(l=>{d+=C(l.dr);k+=C(l.cr)});
 if(post){if(lines.length<2){e.textContent="القيد يحتاج سطرين على الأقل";return}if(lines.some(l=>!l.dr&&!l.cr)){e.textContent="سطر بلا مبلغ";return}if(d!==k||d===0){e.textContent="القيد غير متوازن: الفرق "+n2(d-k);return}}
 const id=ED.id||doc(collection(db,"acc_entries")).id,isNew=!ED.id;
 const data={date:r.date,desc:(r.desc||"").trim(),ref:(r.ref||"").trim(),type:r.type,lines,totalDr:d/100,totalCr:k/100,source:"manual",updatedAt:serverTimestamp()};
 if(isNew){data.createdBy=ME.uid;data.createdAt=serverTimestamp()}
 try{if(post){await runTransaction(db,async tx=>{const mref=doc(db,"acc_meta","counter"),m=await tx.get(mref),n=(m.exists()?m.data().entry||0:0)+1;tx.set(mref,{entry:n});tx.set(doc(db,"acc_entries",id),{...data,no:n,status:"posted",postedAt:serverTimestamp(),postedBy:ME.uid},{merge:true})});log("ترحيل قيد","acc_entries",id)}
  else{await setDoc(doc(db,"acc_entries",id),{...data,status:"draft"},{merge:true});log("حفظ مسودة قيد","acc_entries",id)}
  closeDlg()}catch(x){e.textContent=err(x)}};
function linesTable(e){return`<div class="wrap"><table><tr><th>الحساب</th><th class="n">مدين</th><th class="n">دائن</th><th>مركز التكلفة</th><th>ملاحظة</th></tr>${(e.lines||[]).map(l=>`<tr><td>${esc(accTxt(l.acc)||l.acc)}</td><td class="n">${l.dr?n2(C(l.dr)):""}</td><td class="n">${l.cr?n2(C(l.cr)):""}</td><td>${esc(l.cc||"")}</td><td>${esc(l.note||"")}</td></tr>`).join("")}<tfoot><tr><td>الإجمالي</td><td class="n">${n2(C(e.totalDr))}</td><td class="n">${n2(C(e.totalCr))}</td><td></td><td></td></tr></tfoot></table></div>`}
function entView(e){const[t,c]=stOf(e);openDlg("قيد رقم "+e.no,`<p><span class="tag ${c}">${t}</span> &nbsp; التاريخ: <bdi dir="ltr">${esc(e.date)}</bdi> &nbsp; <span class="mute">(${hij(e.date)} هـ)</span>${e.ref?" &nbsp; المرجع: "+esc(e.ref):""}</p><p>${esc(e.desc)}</p>${e.reversedBy?`<p class="bad-t">هذا القيد معكوس بقيد رقم ${e.reversedNo||""}</p>`:""}${e.source==="reversal"?`<p class="mute">قيد عكسي للقيد رقم ${e.reversesNo||""}</p>`:""}${linesTable(e)}<p class="mute">القيد المرحّل لا يُعدَّل ولا يُحذف؛ التصحيح يكون بعكسه ثم إدخال قيد صحيح.</p>`,
 `<button class="btn" onclick="entPrint('${e._id}')">طباعة</button>${e.reversedBy||e.source==="reversal"?"":`<button class="btn del" onclick="entRev('${e._id}')">عكس القيد</button>`}<button class="btn sec" onclick="closeDlg()">إغلاق</button>`)}
window.entPrint=id=>{const e=S.ent.find(x=>x._id===id);prt("قيد يومية رقم "+e.no,`<p>التاريخ: ${esc(e.date)} (${hij(e.date)} هـ) ${e.ref?" — المرجع: "+esc(e.ref):""}</p><p>${esc(e.desc)}</p><table><tr><th>الحساب</th><th class="n">مدين</th><th class="n">دائن</th><th>مركز التكلفة</th></tr>${e.lines.map(l=>`<tr><td>${esc(accTxt(l.acc))}</td><td class="n">${l.dr?n2(C(l.dr)):""}</td><td class="n">${l.cr?n2(C(l.cr)):""}</td><td>${esc(l.cc||"")}</td></tr>`).join("")}<tfoot><tr><td>الإجمالي</td><td class="n">${n2(C(e.totalDr))}</td><td class="n">${n2(C(e.totalCr))}</td><td></td></tr></tfoot></table>`)};
window.entRev=async id=>{const e=S.ent.find(x=>x._id===id);if(!e||!confirm("عكس القيد رقم "+e.no+"؟ سيُنشأ قيد عكسي مرحّل بتاريخ اليوم."))return;const nid=doc(collection(db,"acc_entries")).id;
 try{await runTransaction(db,async tx=>{const mref=doc(db,"acc_meta","counter"),m=await tx.get(mref),oref=doc(db,"acc_entries",id),o=await tx.get(oref);if(o.data().reversedBy)throw new Error("القيد معكوس مسبقاً");const n=(m.exists()?m.data().entry||0:0)+1;
  tx.set(mref,{entry:n});tx.set(doc(db,"acc_entries",nid),{date:today(),desc:"عكس القيد رقم "+e.no+(e.desc?" — "+e.desc:""),ref:e.ref||"",type:"normal",lines:e.lines.map(l=>({acc:l.acc,dr:l.cr||0,cr:l.dr||0,cc:l.cc||"",note:l.note||""})),totalDr:e.totalCr,totalCr:e.totalDr,status:"posted",source:"reversal",reverses:id,reversesNo:e.no,no:n,createdBy:ME.uid,createdAt:serverTimestamp(),postedAt:serverTimestamp(),postedBy:ME.uid});
  tx.update(oref,{reversedBy:nid,reversedNo:n})});log("عكس قيد","acc_entries",id);closeDlg()}catch(x){alert(err(x))}};

/* ---------- دفتر الأستاذ ---------- */
function ledData(){const f=F.led,a=resAcc(f.acc);if(!a)return null;const set=new Set([a.code]);const st=[a.code];while(st.length){const x=st.pop();kids(x).forEach(k=>{set.add(k.code);st.push(k.code)})}
 const sgn=a.side==="d"?1:-1;let open=0;const rows=[];
 for(const e of S.ent){if(e.status!=="posted")continue;for(const l of e.lines||[]){if(!set.has(l.acc))continue;if(f.cc&&(l.cc||"")!==f.cc)continue;const v=C(l.dr)-C(l.cr);if(f.from&&e.date<f.from){open+=v;continue}if(f.to&&e.date>f.to)continue;rows.push({e,l})}}
 let run=open;rows.forEach(r=>{run+=C(r.l.dr)-C(r.l.cr);r.run=run});return{a,open,rows,run}}
const sd=n=>n2(Math.abs(n))+(n===0?"":n>0?" مدين":" دائن");
function ledHtml(){const d=ledData();if(!d)return`<p class="mute">اختر حساباً لعرض كشفه.</p>`;let td=0,tc=0;d.rows.forEach(r=>{td+=C(r.l.dr);tc+=C(r.l.cr)});
 return`<h3 style="margin:6px 0">${esc(d.a.code+" — "+d.a.name)}${d.a.grp?' <span class="tag">تجميعي: يشمل الفروع</span>':""}</h3><div class="wrap"><table><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th>المركز</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">الرصيد</th></tr>
 <tr><td colspan="6"><b>رصيد أول الفترة</b></td><td class="n"><b>${sd(d.open)}</b></td></tr>${d.rows.map(r=>`<tr style="cursor:pointer" onclick="entOpen('${r.e._id}')"><td dir="ltr">${esc(r.e.date)}</td><td>${r.e.no}</td><td>${esc(r.e.desc)}${d.a.grp?` <span class="mute">[${esc(r.l.acc)}]</span>`:""}</td><td>${esc(r.l.cc||"")}</td><td class="n">${dcell(C(r.l.dr))}</td><td class="n">${dcell(C(r.l.cr))}</td><td class="n">${sd(r.run)}</td></tr>`).join("")}
 <tfoot><tr><td colspan="4">إجمالي الحركة / الرصيد الختامي</td><td class="n">${n2(td)}</td><td class="n">${n2(tc)}</td><td class="n">${sd(d.run)}</td></tr></tfoot></table></div>`}
function led(){const f=F.led;$("main").innerHTML=emptyNote()+`<div class="bar"><div class="grow"><label>الحساب</label><input id="la" list="accl2" value="${esc(f.acc)}" placeholder="اكتب رقم الحساب أو اسمه" onmousedown="acF(this)" onfocus="acF(this)" onblur="acB(this)" onchange="ledF()"><datalist id="accl2">${ordered().map(a=>`<option value="${esc(a.code+" — "+a.name)}"></option>`).join("")}</datalist></div><div><label>من</label>${dateInp("lf1",f.from,"ledF")}</div><div><label>إلى</label>${dateInp("lt1",f.to,"ledF")}</div><div><label>مركز التكلفة</label><select id="lc" onchange="ledF()"><option value="">الكل</option>${S.cars.map(c=>`<option ${c._id===f.cc?"selected":""}>${esc(c._id)}</option>`).join("")}</select></div><button class="btn sec" onclick="ledPrint()">طباعة</button><button class="btn sec" onclick="ledCsv()">تصدير Excel</button></div><div id="lbody">${ledHtml()}</div>`}
window.ledF=()=>{F.led.acc=$("la").value;F.led.from=$("lf1").value;F.led.to=$("lt1").value;F.led.cc=$("lc").value;$("lbody").innerHTML=ledHtml()};
window.ledPrint=()=>{const d=ledData();if(!d){alert("اختر حساباً");return}prt("كشف حساب: "+d.a.code+" — "+d.a.name,`<p>${rangeTxt(F.led.from,F.led.to)}</p>`+$("lbody").innerHTML.replace(/<h3.*?<\/h3>/,"").replace(/onclick="[^"]*"/g,"").replace(/style="cursor:pointer"/g,""))};
window.ledCsv=()=>{const d=ledData();if(!d){alert("اختر حساباً");return}csv("كشف-"+d.a.code,[["التاريخ","رقم القيد","البيان","المركز","مدين","دائن","الرصيد"],["","","رصيد أول الفترة","","","",d.open/100],...d.rows.map(r=>[r.e.date,r.e.no,r.e.desc,r.l.cc||"",r.l.dr||0,r.l.cr||0,r.run/100])])};

/* ---------- ميزان المراجعة ---------- */
function tbData(){const f=F.tb,leaf=f.lvl==="leaf";let op=f.from?agg({before:f.from}):new Map(),mv=agg({from:f.from,to:f.to});if(!leaf){op=roll(op);mv=roll(mv)}
 const list=ordered().filter(a=>leaf?!a.grp:true);const rows=[];let T=[0,0,0,0,0,0];
 for(const a of list){const o=op.get(a.code)||[0,0],m=mv.get(a.code)||[0,0];const on=o[0]-o[1],cn=on+m[0]-m[1];if(f.hz&&!o[0]&&!o[1]&&!m[0]&&!m[1])continue;const[od,oc]=dc(on),[cd,cc]=dc(cn);rows.push({a,od,oc,md:m[0],mc:m[1],cd,cc});if(!a.grp){T[0]+=od;T[1]+=oc;T[2]+=m[0];T[3]+=m[1];T[4]+=cd;T[5]+=cc}}
 if(!leaf){}return{rows,T}}
function tbHtml(){const{rows,T}=tbData();const ok=T[0]===T[1]&&T[2]===T[3]&&T[4]===T[5];
 return`<p>${ok?'<span class="ok-t">✔ الميزان متوازن</span>':'<span class="bad-t">✘ الميزان غير متوازن — راجع القيود</span>'} <span class="mute">${rangeTxt(F.tb.from,F.tb.to)}</span></p><div class="wrap"><table><tr><th rowspan="2">الحساب</th><th colspan="2" class="n" style="text-align:center">الرصيد الافتتاحي</th><th colspan="2" class="n" style="text-align:center">حركة الفترة</th><th colspan="2" class="n" style="text-align:center">الرصيد الختامي</th></tr><tr><th class="n">مدين</th><th class="n">دائن</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">مدين</th><th class="n">دائن</th></tr>
 ${rows.map(r=>`<tr class="${r.a.grp?"grp":""}"><td style="padding-right:${10+depth(r.a.code)*(F.tb.lvl==="leaf"?0:18)}px"><span dir="ltr" style="unicode-bidi:isolate">${esc(r.a.code)}</span> ${esc(r.a.name)}</td><td class="n">${dcell(r.od)}</td><td class="n">${dcell(r.oc)}</td><td class="n">${dcell(r.md)}</td><td class="n">${dcell(r.mc)}</td><td class="n">${dcell(r.cd)}</td><td class="n">${dcell(r.cc)}</td></tr>`).join("")||'<tr><td colspan="7" class="mute">لا توجد حركة</td></tr>'}
 <tfoot><tr><td>الإجمالي (الحسابات النهائية)</td>${T.map(x=>`<td class="n">${n2(x)}</td>`).join("")}</tr></tfoot></table></div>`}
function tb(){const f=F.tb;$("main").innerHTML=emptyNote()+`<div class="bar"><div><label>من</label>${dateInp("tf",f.from,"tbF")}</div><div><label>إلى</label>${dateInp("tt",f.to,"tbF")}</div><div><label>العرض</label><select id="tl" onchange="tbF()"><option value="leaf" ${f.lvl==="leaf"?"selected":""}>الحسابات النهائية فقط</option><option value="all" ${f.lvl==="all"?"selected":""}>كل المستويات (مع التجميع)</option></select></div><div><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="th" style="width:auto" ${f.hz?"checked":""} onchange="tbF()"> إخفاء الحسابات الصفرية</label></div><button class="btn sec" onclick="tbPrint()">طباعة</button><button class="btn sec" onclick="tbCsv()">تصدير Excel</button></div><div id="tbody">${tbHtml()}</div>`}
window.tbF=()=>{F.tb.from=$("tf").value;F.tb.to=$("tt").value;F.tb.lvl=$("tl").value;F.tb.hz=$("th").checked;$("tbody").innerHTML=tbHtml()};
window.tbPrint=()=>prt("ميزان المراجعة",$("tbody").innerHTML);
window.tbCsv=()=>{const{rows,T}=tbData();csv("ميزان-المراجعة",[["رقم الحساب","اسم الحساب","افتتاحي مدين","افتتاحي دائن","حركة مدين","حركة دائن","ختامي مدين","ختامي دائن"],...rows.map(r=>[r.a.code,r.a.name,r.od/100,r.oc/100,r.md/100,r.mc/100,r.cd/100,r.cc/100]),["","الإجمالي",...T.map(x=>x/100)]])};

/* ---------- ربحية السيارات ---------- */
function carData(){const f=F.car,m=new Map();const g=k=>{if(!m.has(k))m.set(k,{rev:0,exp:0});return m.get(k)};S.cars.forEach(c=>g(c._id));
 for(const e of S.ent){if(e.status!=="posted"||(f.from&&e.date<f.from)||(f.to&&e.date>f.to))continue;for(const l of e.lines||[]){const a=S.am.get(l.acc);if(!a)continue;const r=g(l.cc||"");if(a.type==="r")r.rev+=C(l.cr)-C(l.dr);else if(a.type==="x")r.exp+=C(l.dr)-C(l.cr)}}
 return[...m.entries()].map(([k,v])=>({k,...v,p:v.rev-v.exp})).filter(r=>r.rev||r.exp).sort((a,b)=>b.p-a.p)}
function carHtml(){const rows=carData();const T=rows.reduce((s,r)=>[s[0]+r.rev,s[1]+r.exp,s[2]+r.p],[0,0,0]);
 return`<div class="wrap"><table><tr><th>السيارة (مركز التكلفة)</th><th class="n">الإيرادات</th><th class="n">المصروفات</th><th class="n">الربح</th></tr>${rows.map(r=>`<tr><td>${r.k?esc(r.k):'<span class="mute">بدون سيارة (مصروفات وإيرادات عامة)</span>'}</td><td class="n">${n2(r.rev)}</td><td class="n">${n2(r.exp)}</td><td class="n ${r.p<0?"bad-t":""}">${n2(r.p)}</td></tr>`).join("")||'<tr><td colspan="4" class="mute">لا توجد حركة بمراكز تكلفة. اختر السيارة في سطر القيد عند تسجيل مصروفات أو إيرادات.</td></tr>'}<tfoot><tr><td>الإجمالي</td><td class="n">${n2(T[0])}</td><td class="n">${n2(T[1])}</td><td class="n">${n2(T[2])}</td></tr></tfoot></table></div>`}
function car(){const f=F.car;$("main").innerHTML=`<div class="bar"><div><label>من</label>${dateInp("cf",f.from,"carF")}</div><div><label>إلى</label>${dateInp("ct",f.to,"carF")}</div><button class="btn sec" onclick="carPrint()">طباعة</button></div><p class="mute" style="margin-top:0">الإيرادات والمصروفات المسجّلة في القيود المرحّلة على كل سيارة (مركز تكلفة).</p><div id="cbody">${carHtml()}</div>`}
window.carF=()=>{F.car.from=$("cf").value;F.car.to=$("ct").value;$("cbody").innerHTML=carHtml()};
window.carPrint=()=>prt("ربحية السيارات — "+rangeTxt(F.car.from,F.car.to),$("cbody").innerHTML);

/* اختيار الحساب: عند الضغط يُفرَّغ الحقل مؤقتاً لتظهر القائمة كاملة، ويعود المختار إن لم يُغيَّر */
window.acF=el=>{if(el.value){el.dataset.prev=el.value;el.placeholder=el.value;el.value=""}};
window.acB=el=>{setTimeout(()=>{if(el.value===""&&el.dataset.prev){el.value=el.dataset.prev}el.placeholder="اكتب رقم الحساب أو اسمه"},150)};
/* ---------- تنبيه التحديث ---------- */
async function chkVer(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();const v=(t.match(/name="app-version" content="([^"]*)"/)||[])[1],n=(t.match(/name="app-note" content="([^"]*)"/)||[])[1];const cur=document.querySelector('meta[name="app-version"]').content;
 if(v&&v!==cur)$("ban").innerHTML=`<div class="ban">يتوفر إصدار أحدث (${esc(v)})${n?": "+esc(n):""} <button class="btn sm" onclick="location.href=location.pathname+'?v='+Date.now()">تحديث الآن</button></div>`}catch(e){}}
</script>
