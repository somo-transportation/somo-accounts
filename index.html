<style>
:root{--bg:#fff9d6;--card:#fffef5;--ink:#0b6e99;--mute:#3f8fb0;--pri:#0e7490;--pri2:#0a5a73;--line:#e8dfa6;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{background:var(--pri2);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:1.2rem;flex:1;min-width:180px}header small{display:block;font-weight:400;opacity:.85;font-size:.8rem}
header a{color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1250px;margin:0 auto;padding:16px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input:disabled{opacity:.5}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 2px}
.btn{border:0;background:var(--pri);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.del{background:var(--bad)}.btn.sm{padding:3px 10px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:default}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:1.35rem;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.kpi span{font-size:.85rem;color:var(--mute)}

<div id="ban"></div><div id="app"></div>
<dialog id="dlg"><div class="dh" id="dh"></div><div class="db" id="db"></div><div class="da" id="da"></div></dialog>
<datalist id="accl"></datalist><datalist id="pl_customers"></datalist><datalist id="pl_suppliers"></datalist><datalist id="pl_drivers"></datalist><datalist id="pl_all"></datalist><datalist id="tripl"></datalist>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,addDoc,serverTimestamp,runTransaction,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const CFG={apiKey:"AIzaSyDix-1jo4u4_nwBGLGIwtvW1L7FcjxizX4",authDomain:"somo-transport.firebaseapp.com",projectId:"somo-transport",storageBucket:"somo-transport.firebasestorage.app",messagingSenderId:"987984151527",appId:"1:987984151527:web:7d1030349784ed9072b342"};
const app=initializeApp(CFG),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=id=>document.getElementById(id),A=$("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>{const v=parseFloat(String(x??"").replace(/,/g,""));return isNaN(v)?0:v};
const C=x=>Math.round(num(x)*100),n2=c=>(c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const rnd=x=>Math.round(x*100)/100;
const pad=(n,w)=>String(n).padStart(w,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)};
const okD=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;const d=new Date(s+"T00:00:00Z");return!isNaN(d)&&d.toISOString().slice(0,10)===s};
const hij=s=>{try{if(!okD(s))return"";const o={};new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date(s+"T12:00:00")).forEach(x=>o[x.type]=x.value);const r=(o.year||o.relatedYear)+"-"+pad(o.month,2)+"-"+pad(o.day,2);return/^\d{4}-\d{2}-\d{2}$/.test(r)?r:""}catch(e){return""}};
const TYPES={a:"أصول",l:"التزامات",e:"حقوق ملكية",r:"إيرادات",x:"مصروفات"},SIDE={a:"d",x:"d",l:"c",e:"c",r:"c"};
const KL={customers:"عميل",suppliers:"مورد",drivers:"سائق"},KP={customers:"العملاء",suppliers:"الموردون",drivers:"السائقون"};
const KS={customers:["cust","CustNo","CustName"],suppliers:["supp","SuppNo","SuppName"],drivers:["drv","DrivNo","DrivName"]};
let ME=null,tab="home",S={acc:[],ent:[],cc:[],cust:[],supp:[],drv:[],cars:[],trips:[],am:new Map(),cm:new Map()},unsubs=[],EXP=new Set(["1","2","3","4","5","6"]);
const F={ent:{from:"",to:"",st:"",q:""},led:{acc:"",party:"",from:"",to:"",cc:""},tb:{from:"",to:today(),lvl:"leaf",hz:true},prf:{from:today().slice(0,4)+"-01-01",to:today(),mode:"cc"},par:{k:"customers",from:"",to:today()},vat:{from:today().slice(0,4)+"-01-01",to:today()},coa:{q:""}};
const log=(a,c,k)=>addDoc(collection(db,"audit"),{uid:ME.uid,name:ME.name||ME.email,action:a,coll:c,key:String(k),ts:serverTimestamp()}).catch(()=>{});
const ERR={"auth/invalid-credential":"البريد أو كلمة السر غير صحيحة","auth/invalid-email":"البريد غير صحيح","auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً","permission-denied":"لا تملك صلاحية تنفيذ هذه العملية"};
const err=e=>ERR[e.code]||e.message||String(e);
const sortC=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
const strip=c=>String(c).replace(/0+$/,"")||String(c);

/* ---------- الأطراف (عملاء/موردون/سائقون من نظام السمو) ---------- */
const partyList=k=>(S[KS[k][0]]||[]).map(r=>({k,no:String(r[KS[k][1]]??"").trim(),name:String(r[KS[k][2]]||"").trim()})).filter(p=>p.no);
const partyTxt=p=>p.no+" — "+p.name;
function partyFind(k,s){s=String(s||"").trim();if(!s)return null;const l=partyList(k),no=s.split(/\s*—\s*/)[0].trim();return l.find(p=>p.no===no)||l.find(p=>p.name===s)||null}
function partyAny(s){s=String(s||"").trim();if(!s)return null;const m=s.match(/^(\S+)\s+(\S+)\s+—\s+/);if(!m)return null;const k=Object.keys(KL).find(x=>KL[x]===m[1]);return k?(partyList(k).find(p=>p.no===m[2])||null):null}
const lineParty=l=>l.party?{k:l.party.k,no:String(l.party.no),name:l.partyName||""}:null;
const ccName=c=>{const x=S.cm.get(c);return x?x.code+" — "+x.name:(c||"")};

/* ---------- تسجيل الدخول والصلاحية ---------- */
function loginView(m){A.innerHTML=`<div class="box"><h2 style="margin:0;text-align:center">محاسبة برج السمو</h2><p class="mute" style="text-align:center">تسجيل الدخول (نفس حساب نظام السمو)</p><form id="lf"><label>البريد الإلكتروني</label><input type="email" id="em" autocomplete="username" required><label>كلمة السر</label><input type="password" id="pw" autocomplete="current-password" required><div class="er" id="er">${esc(m||"")}</div><button class="btn" style="width:100%">دخول</button></form></div>`;
 $("lf").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(x){$("er").textContent=err(x)}}}
function stop(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[]}
onAuthStateChanged(auth,async u=>{stop();ME=null;if(!u)return loginView();
 try{const s=await getDoc(doc(db,"users",u.uid));const d=s.exists()?s.data():null;
  if(!d||d.active!==true){A.innerHTML=`<div class="box"><p>حسابك غير مفعّل. تواصل مع المدير.</p><button class="btn" onclick="logout()">خروج</button></div>`;return}
  ME={uid:u.uid,email:u.email,name:d.name,role:d.role,acct:d.role==="admin"||d.acct===true};
  if(!ME.acct){A.innerHTML=`<div class="box"><h3 style="margin-top:0">لا تملك صلاحية المحاسبة</h3><p>اطلب من المدير تفعيل صلاحية «المحاسبة» لحسابك من صفحة إدارة النظام.</p><a class="btn" href="../somo/" style="text-decoration:none;display:inline-block">العودة لنظام السمو</a> <button class="btn sec" onclick="logout()">خروج</button></div>`;return}
  start()}catch(x){A.innerHTML=`<div class="box"><p class="er">${esc(err(x))}</p><button class="btn" onclick="logout()">خروج</button></div>`}});
window.logout=()=>signOut(auth);
function sub(name,key,fn){unsubs.push(onSnapshot(collection(db,name),s=>{S[key]=s.docs.map(d=>({...d.data(),_id:d.id}));if(fn)fn();sched()},e=>{console.warn(name,e.code)}))}
let rq=0;function sched(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(ME)view()})}
function start(){
 sub("acc_accounts","acc",()=>{S.acc.sort(sortC);S.am=new Map(S.acc.map(a=>[a.code,a]));draw()});
 sub("acc_cc","cc",()=>{S.cc.sort(sortC);S.cm=new Map(S.cc.map(a=>[a.code,a]))});
 sub("acc_entries","ent",()=>{S.ent.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.no||1e12)-(b.no||1e12))});
 sub("customers","cust",draw);sub("suppliers","supp",draw);sub("drivers","drv",draw);sub("cars","cars");sub("trips","trips",draw);shell();chkVer();setInterval(chkVer,300000)}
function draw(){const set=(id,h)=>{const e=$(id);if(e)e.innerHTML=h};
 set("accl",ordered().filter(a=>!a.grp&&a.active!==false).map(a=>`<option value="${esc(a.code+" — "+a.name)}"></option>`).join(""));
 for(const k of Object.keys(KL))set("pl_"+k,partyList(k).map(p=>`<option value="${esc(partyTxt(p))}"></option>`).join(""));
 set("pl_all",Object.keys(KL).flatMap(k=>partyList(k).map(p=>`<option value="${esc(KL[k]+" "+partyTxt(p))}"></option>`)).join(""));
 set("tripl",(S.trips||[]).map(t=>`<option value="${esc(t.ContNo)}"></option>`).join(""))}
const TABS=[["home","الرئيسية"],["coa","دليل الحسابات"],["cc","مراكز التكلفة"],["ent","قيود اليومية"],["led","دفتر الأستاذ"],["tb","ميزان المراجعة"],["par","الأطراف"],["prf","ربحية الشاحنات والرحلات"],["vat","الضريبة"]];
function shell(){A.innerHTML=`<header><h1>محاسبة برج السمو للنقليات<small>${esc(ME.name||ME.email)} · نسخة <span id="vv"></span></small></h1><a class="btn sec" style="color:#fff;border-color:#fff8;text-decoration:none" href="../somo/">← نظام السمو</a><button class="btn sec" style="color:#fff;border-color:#fff8" onclick="logout()">خروج</button></header><nav id="nv">${TABS.map(([k,n])=>`<button data-t="${k}" onclick="go('${k}')">${n}</button>`).join("")}</nav><main id="main"></main>`;
 const m=document.querySelector('meta[name="app-version"]');$("vv").textContent=m?m.content:"";view()}
window.go=t=>{tab=t;view()};
const VIEWS={home,coa,cc:ccView,ent,led,tb,par:parView,prf:prfView,vat:vatView};
function view(){if(!$("main"))return;document.querySelectorAll("#nv button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));VIEWS[tab]()}

/* ---------- أدوات ---------- */
const depth=c=>{let d=0,x=S.am.get(c);while(x&&x.parent&&d<20){d++;x=S.am.get(x.parent)}return d};
const kids=c=>S.acc.filter(a=>(a.parent||"")===c);
const ordered=()=>{const o=[],seen=new Set();const add=p=>kids(p).forEach(a=>{if(seen.has(a.code))return;seen.add(a.code);o.push(a);add(a.code)});add("");S.acc.forEach(a=>{if(!seen.has(a.code))o.push(a)});return o};
const hasEnt=c=>{const set=new Set([c]);const st=[c];while(st.length){const x=st.pop();kids(x).forEach(k=>{set.add(k.code);st.push(k.code)})}return S.ent.some(e=>(e.lines||[]).some(l=>set.has(l.acc)))};
function agg(f){const m=new Map();for(const e of S.ent){if(e.status!=="posted")continue;if(f.from&&e.date<f.from)continue;if(f.to&&e.date>f.to)continue;if(f.before&&e.date>=f.before)continue;for(const l of e.lines||[]){if(f.cc&&(l.cc||"")!==f.cc)continue;const a=m.get(l.acc)||[0,0];a[0]+=C(l.dr);a[1]+=C(l.cr);m.set(l.acc,a)}}return m}
function roll(m){const t=new Map();for(const[c,[d,k]]of m){let x=c,g=0;while(x&&g++<20){const a=t.get(x)||[0,0];a[0]+=d;a[1]+=k;t.set(x,a);const ac=S.am.get(x);x=ac?ac.parent:""}}return t}
const net=(a,code)=>{const x=a?a:[0,0];const s=(S.am.get(code)||{}).side||"d";return s==="d"?x[0]-x[1]:x[1]-x[0]};
const dc=n=>n>=0?[n,0]:[0,-n];
const dcell=n=>n?n2(n):"";
function dateInp(id,v,on){return`<span class="dfw"><input id="${id}" dir="ltr" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd" autocomplete="off" value="${esc(v||"")}" data-on="${on||""}" oninput="dm(this)"><button type="button" onclick="pickD('${id}')" title="التقويم">📅</button></span>`}
window.dm=el=>{const v=el.value.replace(/\D/g,"").slice(0,8);el.value=v.slice(0,4)+(v.length>4?"-"+v.slice(4,6):"")+(v.length>6?"-"+v.slice(6,8):"");if(el.dataset.on&&(el.value===""||okD(el.value)))window[el.dataset.on](el)};
window.pickD=id=>{const el=$(id),t=document.createElement("input");t.type="date";t.style.cssText="position:fixed;opacity:0;pointer-events:none";if(okD(el.value))t.value=el.value;document.body.appendChild(t);t.onchange=()=>{el.value=t.value;el.dispatchEvent(new Event("input"));t.remove()};t.onblur=()=>setTimeout(()=>t.remove(),300);try{t.showPicker()}catch(e){t.click()}};
function openDlg(title,body,btns){$("dh").textContent=title;$("db").innerHTML=body;$("da").innerHTML=btns;if(!$("dlg").open)$("dlg").showModal()}
window.closeDlg=()=>{$("dlg").close()};
function prt(title,html){const w=window.open("","_blank");if(!w){alert("اسمح بالنوافذ المنبثقة للطباعة");return}w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:18px;color:#111}h2,h3{margin:4px 0}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}th,td{border:1px solid #888;padding:4px 6px;text-align:right}th{background:#eee}td.n,th.n{text-align:left;direction:ltr}tfoot td{font-weight:700;background:#f4f4f4}.m{color:#555;font-size:12px}@media print{button{display:none}}</style></head><body><h2>برج السمو للنقليات</h2><h3>${esc(title)}</h3>${html}<p class="m">طُبع بتاريخ ${today()}</p><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}
function csv(name,rows){const t="﻿"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const rangeTxt=(f,t)=>(f||t)?`الفترة: ${f||"البداية"} إلى ${t||"اليوم"}`:"كل الفترات";
const legacy=()=>S.acc.length>0&&!S.am.has("11001");

 return{rows,T}}
function tbHtml(){const{rows,T}=tbData();const ok=T[0]===T[1]&&T[2]===T[3]&&T[4]===T[5];
 return`<p>${ok?'<span class="ok-t">✔ الميزان متوازن</span>':'<span class="bad-t">✘ الميزان غير متوازن — راجع القيود</span>'} <span class="mute">${rangeTxt(F.tb.from,F.tb.to)}</span></p><div class="wrap"><table><tr><th rowspan="2">الحساب</th><th colspan="2" class="n" style="text-align:center">الرصيد الافتتاحي</th><th colspan="2" class="n" style="text-align:center">حركة الفترة</th><th colspan="2" class="n" style="text-align:center">الرصيد الختامي</th></tr><tr><th class="n">مدين</th><th class="n">دائن</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">مدين</th><th class="n">دائن</th></tr>
 ${rows.map(r=>`<tr class="${r.a.grp?"grp":""}"><td style="padding-right:${10+depth(r.a.code)*(F.tb.lvl==="leaf"?0:18)}px"><span dir="ltr" style="unicode-bidi:isolate">${esc(r.a.code)}</span> ${esc(r.a.name)}</td><td class="n">${dcell(r.od)}</td><td class="n">${dcell(r.oc)}</td><td class="n">${dcell(r.md)}</td><td class="n">${dcell(r.mc)}</td><td class="n">${dcell(r.cd)}</td><td class="n">${dcell(r.cc)}</td></tr>`).join("")||'<tr><td colspan="7" class="mute">لا توجد حركة</td></tr>'}
 <tfoot><tr><td>الإجمالي (الحسابات التفصيلية)</td>${T.map(x=>`<td class="n">${n2(x)}</td>`).join("")}</tr></tfoot></table></div>`}
function tb(){const f=F.tb;$("main").innerHTML=emptyNote()+`<div class="bar"><div><label>من</label>${dateInp("tf",f.from,"tbF")}</div><div><label>إلى</label>${dateInp("tt",f.to,"tbF")}</div><div><label>العرض</label><select id="tl" onchange="tbF()"><option value="leaf" ${f.lvl==="leaf"?"selected":""}>الحسابات التفصيلية فقط</option><option value="all" ${f.lvl==="all"?"selected":""}>كل المستويات (مع التجميع)</option></select></div><div><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="th" style="width:auto" ${f.hz?"checked":""} onchange="tbF()"> إخفاء الحسابات الصفرية</label></div><button class="btn sec" onclick="tbPrint()">طباعة</button><button class="btn sec" onclick="tbCsv()">تصدير Excel</button></div><div id="tbody">${tbHtml()}</div>`}
window.tbF=()=>{F.tb.from=$("tf").value;F.tb.to=$("tt").value;F.tb.lvl=$("tl").value;F.tb.hz=$("th").checked;$("tbody").innerHTML=tbHtml()};
window.tbPrint=()=>prt("ميزان المراجعة",$("tbody").innerHTML);
window.tbCsv=()=>{const{rows,T}=tbData();csv("ميزان-المراجعة",[["رقم الحساب","اسم الحساب","افتتاحي مدين","افتتاحي دائن","حركة مدين","حركة دائن","ختامي مدين","ختامي دائن"],...rows.map(r=>[r.a.code,r.a.name,r.od/100,r.oc/100,r.md/100,r.mc/100,r.cd/100,r.cc/100]),["","الإجمالي",...T.map(x=>x/100)]])};

/* ---------- الأطراف ---------- */
function parData(){const f=F.par,m=new Map();for(const e of S.ent){if(e.status!=="posted"||(f.from&&e.date<f.from)||(f.to&&e.date>f.to))continue;for(const l of e.lines||[]){const p=lineParty(l);if(!p||p.k!==f.k)continue;const r=m.get(p.no)||{no:p.no,name:p.name,dr:0,cr:0};r.dr+=C(l.dr);r.cr+=C(l.cr);if(p.name)r.name=p.name;m.set(p.no,r)}}
 return[...m.values()].sort((a,b)=>Math.abs(b.dr-b.cr)-Math.abs(a.dr-a.cr))}
function parHtml(){const rows=parData();const T=rows.reduce((s,r)=>[s[0]+r.dr,s[1]+r.cr],[0,0]);
 return`<div class="wrap"><table><tr><th>${KL[F.par.k]}</th><th>الاسم</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">الرصيد</th><th></th></tr>${rows.map(r=>`<tr><td dir="ltr">${esc(r.no)}</td><td>${esc(r.name)}</td><td class="n">${dcell(r.dr)}</td><td class="n">${dcell(r.cr)}</td><td class="n">${sd(r.dr-r.cr)}</td><td><button class="btn sm sec" onclick="parGo('${F.par.k}','${esc(r.no)}')">كشف الحساب</button></td></tr>`).join("")||'<tr><td colspan="6" class="mute">لا توجد حركة لهذا النوع من الأطراف</td></tr>'}<tfoot><tr><td colspan="2">الإجمالي</td><td class="n">${n2(T[0])}</td><td class="n">${n2(T[1])}</td><td class="n">${sd(T[0]-T[1])}</td><td></td></tr></tfoot></table></div>`}
function parView(){const f=F.par;$("main").innerHTML=emptyNote()+`<div class="bar"><div><label>النوع</label><select id="pk" onchange="parF()">${Object.keys(KL).map(k=>`<option value="${k}" ${k===f.k?"selected":""}>${KP[k]}</option>`).join("")}</select></div><div><label>من</label>${dateInp("pf",f.from,"parF")}</div><div><label>إلى</label>${dateInp("pt",f.to,"parF")}</div><button class="btn sec" onclick="parPrint()">طباعة</button><button class="btn sec" onclick="parCsv()">تصدير Excel</button></div><p class="mute" style="margin-top:0">أرصدة الأطراف من القيود المرحّلة التي اختير فيها الطرف (عميل أو مورد أو سائق من نظام السمو).</p><div id="pbody">${parHtml()}</div>`}
window.parF=()=>{F.par.k=$("pk").value;F.par.from=$("pf").value;F.par.to=$("pt").value;$("pbody").innerHTML=parHtml()};
window.parGo=(k,no)=>{const p=partyList(k).find(x=>x.no===no);F.led.acc="";F.led.party=p?KL[k]+" "+partyTxt(p):"";F.led.from=F.par.from;F.led.to=F.par.to;tab="led";view()};
window.parPrint=()=>prt(KP[F.par.k]+" — أرصدة الأطراف",`<p>${rangeTxt(F.par.from,F.par.to)}</p>`+$("pbody").innerHTML.replace(/<button.*?<\/button>/g,""));
window.parCsv=()=>{const r=parData();csv("أرصدة-"+KP[F.par.k],[["الرقم","الاسم","مدين","دائن","الرصيد (مدين موجب)"],...r.map(x=>[x.no,x.name,x.dr/100,x.cr/100,(x.dr-x.cr)/100])])};

/* ---------- ربحية الشاحنات والرحلات ---------- */
const catOf=c=>c==="41001"?0:String(c).startsWith("43")?1:(c==="44001"||c==="44002")?2:String(c).startsWith("42")?3:c==="44004"?4:String(c).startsWith("46")?5:6;
const TC=["الديزل","السائق","الطرق والموازين","الصيانة","تحميل وتنزيل","نقل من الباطن","مصروفات أخرى"];
function prfData(){const f=F.prf,m=new Map(),trip=f.mode==="trip";
 for(const e of S.ent){if(e.status!=="posted"||(f.from&&e.date<f.from)||(f.to&&e.date>f.to))continue;for(const l of e.lines||[]){const a=S.am.get(l.acc);if(!a||(a.type!=="r"&&a.type!=="x"))continue;const key=trip?(l.trip||""):(l.cc||"");if(trip&&!key)continue;
  const r=m.get(key)||{k:key,rev:0,c:[0,0,0,0,0,0,0]};if(a.type==="r")r.rev+=C(l.cr)-C(l.dr);else r.c[catOf(l.acc)]+=C(l.dr)-C(l.cr);m.set(key,r)}}
 if(!trip)S.cc.filter(c=>c.type==="شاحنة"&&c.active!==false).forEach(c=>{if(!m.has(c.code))m.set(c.code,{k:c.code,rev:0,c:[0,0,0,0,0,0,0]})});
 return[...m.values()].map(r=>{const cost=r.c.reduce((s,x)=>s+x,0);return{...r,cost,p:r.rev-cost,mg:r.rev?Math.round((r.rev-cost)/r.rev*1000)/10:0}}).filter(r=>r.rev||r.cost).sort((a,b)=>trip?String(a.k).localeCompare(String(b.k),undefined,{numeric:true}):b.p-a.p)}
function prfHtml(){const rows=prfData(),trip=F.prf.mode==="trip";const T=rows.reduce((s,r)=>({rev:s.rev+r.rev,cost:s.cost+r.cost,p:s.p+r.p,c:s.c.map((x,i)=>x+r.c[i])}),{rev:0,cost:0,p:0,c:[0,0,0,0,0,0,0]});
 if(trip)return`<div class="wrap"><table><tr><th>رقم الرحلة</th><th class="n">الإيراد</th>${TC.map(t=>`<th class="n">${t}</th>`).join("")}<th class="n">إجمالي التكلفة</th><th class="n">الربح</th><th class="n">الهامش</th></tr>${rows.map(r=>`<tr><td dir="ltr">${esc(r.k)}</td><td class="n">${n2(r.rev)}</td>${r.c.map(x=>`<td class="n">${dcell(x)}</td>`).join("")}<td class="n">${n2(r.cost)}</td><td class="n ${r.p<0?"bad-t":""}">${n2(r.p)}</td><td class="n">${r.mg}%</td></tr>`).join("")||'<tr><td colspan="11" class="mute">لا توجد قيود عليها رقم رحلة. اكتب رقم الرحلة في سطور القيود.</td></tr>'}<tfoot><tr><td>الإجمالي</td><td class="n">${n2(T.rev)}</td>${T.c.map(x=>`<td class="n">${n2(x)}</td>`).join("")}<td class="n">${n2(T.cost)}</td><td class="n">${n2(T.p)}</td><td class="n">${T.rev?Math.round(T.p/T.rev*1000)/10:0}%</td></tr></tfoot></table></div>`;
 return`<div class="wrap"><table><tr><th>مركز التكلفة</th><th class="n">الإيرادات</th><th class="n">المصروفات</th><th class="n">الربح</th><th class="n">الهامش</th></tr>${rows.map(r=>`<tr><td>${r.k?esc(ccName(r.k)):'<span class="mute">بدون مركز تكلفة</span>'}</td><td class="n">${n2(r.rev)}</td><td class="n">${n2(r.cost)}</td><td class="n ${r.p<0?"bad-t":""}">${n2(r.p)}</td><td class="n">${r.mg}%</td></tr>`).join("")||'<tr><td colspan="5" class="mute">لا توجد حركة بمراكز تكلفة</td></tr>'}<tfoot><tr><td>الإجمالي</td><td class="n">${n2(T.rev)}</td><td class="n">${n2(T.cost)}</td><td class="n">${n2(T.p)}</td><td class="n">${T.rev?Math.round(T.p/T.rev*1000)/10:0}%</td></tr></tfoot></table></div>`}
function prfView(){const f=F.prf;$("main").innerHTML=`<div class="bar"><div><label>العرض</label><select id="pm" onchange="prfF()"><option value="cc" ${f.mode==="cc"?"selected":""}>حسب مركز التكلفة (الشاحنات)</option><option value="trip" ${f.mode==="trip"?"selected":""}>حسب رقم الرحلة</option></select></div><div><label>من</label>${dateInp("rf",f.from,"prfF")}</div><div><label>إلى</label>${dateInp("rt",f.to,"prfF")}</div><button class="btn sec" onclick="prfPrint()">طباعة</button></div><p class="mute" style="margin-top:0">الإيرادات والمصروفات المسجّلة في القيود المرحّلة، موزَّعة على المراكز أو الرحلات، دون الضريبة لأنها في حسابات مستقلة.</p><div id="rbody">${prfHtml()}</div>`}
window.prfF=()=>{F.prf.mode=$("pm").value;F.prf.from=$("rf").value;F.prf.to=$("rt").value;$("rbody").innerHTML=prfHtml()};
window.prfPrint=()=>prt("ربحية "+(F.prf.mode==="trip"?"الرحلات":"الشاحنات")+" — "+rangeTxt(F.prf.from,F.prf.to),$("rbody").innerHTML);

/* ---------- الضريبة (ملخص مراجعة) ---------- */
function vatHtml(){const f=F.vat,m=agg({from:f.from,to:f.to});const mv=c=>m.get(c)||[0,0];const cr=c=>mv(c)[1]-mv(c)[0],dr=c=>mv(c)[0]-mv(c)[1];
 let taxable=0,intl=0,disc=0;for(const a of S.acc){if(a.grp||a.type!=="r"||!a.code.startsWith("3"))continue;if(a.code==="30008")intl+=cr(a.code);else if(a.code==="30901")disc+=cr(a.code);else taxable+=cr(a.code)}
 const out=cr("21301"),inD=dr("11701"),inN=dr("11702"),inP=dr("11703"),exp15=Math.round((taxable+disc)*0.15),diff=out-exp15,netv=out-inD;
 const R=(l,v,x)=>`<tr><td>${l}</td><td class="n">${n2(v)}</td><td class="mute">${x||""}</td></tr>`;
 return`<div class="wrap"><table><tr><th>البند</th><th class="n">المبلغ</th><th>ملاحظة</th></tr>
 ${R("مبيعات النقل المحلي (صافي الخصومات، تقديري)",taxable+disc,"من حسابات الإيرادات ما عدا النقل الدولي")}${R("مبيعات النقل الدولي",intl,"قد تخضع لنسبة الصفر بشروطها ومستنداتها، ولا تُطبَّق تلقائياً")}
 ${R("ضريبة المخرجات المسجّلة (21301)",out)}${R("ضريبة المخرجات المتوقعة 15% على المبيعات المحلية",exp15,"للمقارنة فقط")}
 <tr><td>الفرق بين المسجَّل والمتوقع</td><td class="n ${Math.abs(diff)>100?"warn-t":""}">${n2(diff)}</td><td class="mute">${Math.abs(diff)>100?"قد تكون هناك فواتير بلا سطر ضريبة، أو مبيعات معفاة أو بنسبة صفر":"لا فرق يُذكر"}</td></tr>
 ${R("ضريبة المدخلات القابلة للخصم (11701)",inD)}${R("ضريبة المدخلات غير القابلة للخصم (11702)",inN,"لا تُخصم")}${R("ضريبة المدخلات المعلقة (11703)",inP,"تُراجَع قبل الخصم")}
 <tfoot><tr><td>صافي الضريبة (المخرجات − المدخلات القابلة للخصم)</td><td class="n">${n2(netv)}</td><td>${netv>0?"مستحق للهيئة":netv<0?"رصيد لصالحكم":""}</td></tr></tfoot></table></div>`}
function vatView(){const f=F.vat;$("main").innerHTML=`<div class="bar"><div><label>من</label>${dateInp("vf",f.from,"vatF")}</div><div><label>إلى</label>${dateInp("vt",f.to,"vatF")}</div><button class="btn sec" onclick="vatPrint()">طباعة</button></div><div class="note">هذا <b>ملخص مراجعة</b> من القيود المرحّلة، وليس الإقرار الرسمي. المعالجة النهائية (النسب، النقل الدولي، المشتريات غير المؤهلة) يقررها المحاسب القانوني وفق تعليمات هيئة الزكاة والضريبة والجمارك.</div><div id="vbody">${vatHtml()}</div>`}
window.vatF=()=>{F.vat.from=$("vf").value;F.vat.to=$("vt").value;$("vbody").innerHTML=vatHtml()};
window.vatPrint=()=>prt("ملخص ضريبة القيمة المضافة — "+rangeTxt(F.vat.from,F.vat.to),$("vbody").innerHTML);

/* ---------- تنبيه التحديث ---------- */
async function chkVer(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();const v=(t.match(/name="app-version" content="([^"]*)"/)||[])[1],n=(t.match(/name="app-note" content="([^"]*)"/)||[])[1];const cur=document.querySelector('meta[name="app-version"]').content;
 if(v&&v!==cur)$("ban").innerHTML=`<div class="ban">يتوفر إصدار أحدث (${esc(v)})${n?": "+esc(n):""} <button class="btn sm" onclick="location.href=location.pathname+'?v='+Date.now()">تحديث الآن</button></div>`}catch(e){}}
</script>
</body>
</html>
